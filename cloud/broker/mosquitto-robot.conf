# mosquitto-robot.conf - EC2 broker config (design doc
# docs/superpowers/specs/2026-10-04-cloud-web-dashboard-design.md, D2-D5).
# Installed by setup_instance.sh as /etc/mosquitto/conf.d/robot.conf; the
# Ubuntu package's own /etc/mosquitto/mosquitto.conf includes conf.d/.
# Local-rehearsal broker is cloud/mosquitto/mosquitto.conf (anonymous, no
# TLS) - never use that one on a public host.

# Global (per_listener_settings false): every listener requires a login
# and is bound by the same ACL.
allow_anonymous false
password_file /etc/mosquitto/passwd
acl_file /etc/mosquitto/acl

# ESP32: MQTT over TLS, public (security group opens 8883). The server cert
# is signed by the project CA the firmware pins (secrets.h MQTT_CA_CERT).
listener 8883
cafile /etc/mosquitto/certs/ca.crt
certfile /etc/mosquitto/certs/server.crt
keyfile /etc/mosquitto/certs/server.key

# Browser dashboard: MQTT over WebSocket, localhost only. nginx terminates
# TLS on 443 and proxies wss://<host>/mqtt here, so this plain listener is
# never reachable from outside the instance.
listener 9001 127.0.0.1
protocol websockets
