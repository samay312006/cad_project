# nginx-robot.conf - EC2 dashboard site (design D3). Installed by
# setup_instance.sh as /etc/nginx/sites-available/robot (and enabled in
# place of the default site). Serves cloud/dashboard/ over HTTPS and
# proxies the dashboard's MQTT-over-WebSocket connection to Mosquitto's
# localhost-only listener.

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _;

    # server.crt + ca.crt (fullchain), signed by the project CA. Self-signed
    # chain: the phone browser warns once unless the CA is installed on it.
    ssl_certificate     /etc/nginx/robot/fullchain.crt;
    ssl_certificate_key /etc/nginx/robot/server.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    root /var/www/robot-dashboard;
    index index.html;
    # Bring-up tool: always fetch the latest dashboard files after a redeploy.
    add_header Cache-Control "no-store" always;

    location = /mqtt {
        proxy_pass http://127.0.0.1:9001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        # MQTT keepalive pings keep the socket busy; this only bounds a
        # truly dead connection.
        proxy_read_timeout 300s;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
