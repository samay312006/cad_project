<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Robot Drive Dashboard</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
  <div class="login-overlay" id="loginOverlay" hidden>
    <form class="login-box" id="loginForm" autocomplete="on">
      <h1>Robot Dashboard</h1>
      <label for="loginUser">Username</label>
      <input id="loginUser" name="username" autocomplete="username" autocapitalize="none" spellcheck="false" value="dashboard">
      <label for="loginPass">Password</label>
      <input id="loginPass" name="password" type="password" autocomplete="current-password">
      <div class="login-error" id="loginError" role="alert"></div>
      <button type="submit">Connect</button>
    </form>
  </div>
  <div class="hud">
    <section class="panel panel-control">
      <div class="status-ring" id="statusRing">
        <div class="joystick-base" id="joystickBase">
          <div class="joystick-puck" id="joystickPuck"></div>
        </div>
      </div>
      <div class="speed-cap">
        <label for="speedCap">SPEED CAP</label>
        <input type="range" id="speedCap" min="0" max="100" value="100">
        <span id="speedCapValue">100%</span>
      </div>
      <div class="warning" id="warningLabel"></div>
    </section>

    <section class="panel panel-telemetry">
      <div class="current-bars">
        <div class="current-bar">
          <span class="bar-value" id="currentLeftValue">0.00 A</span>
          <div class="bar-well"><div class="bar-fill bar-left" id="currentLeftFill"></div></div>
          <span class="bar-label">LEFT</span>
        </div>
        <div class="current-bar">
          <span class="bar-value" id="currentRightValue">0.00 A</span>
          <div class="bar-well"><div class="bar-fill bar-right" id="currentRightFill"></div></div>
          <span class="bar-label">RIGHT</span>
        </div>
      </div>
      <div class="bar-sub" id="dutyValue">L -- / R --</div>
    </section>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/mqtt@5.10.1/dist/mqtt.min.js"></script>
  <script src="/mix.js"></script>
  <script src="/mqtt_topics.js"></script>
  <script src="/app.js"></script>
</body>
</html>
