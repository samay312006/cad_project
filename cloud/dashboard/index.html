<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Robot Drive Dashboard</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
  <div class="hud">
    <section class="panel panel-control">
      <div class="status-ring" id="statusRing">
        <div class="joystick-base" id="joystickBase">
          <div class="joystick-puck" id="joystickPuck"></div>
        </div>
      </div>
      <div class="speed-cap">
        <label for="speedCap">SPEED CAP</label>
        <input type="range" id="speedCap" min="0" max="100" value="60">
        <span id="speedCapValue">60%</span>
      </div>
      <div class="warning" id="warningLabel"></div>
    </section>

    <section class="panel panel-telemetry">
      <svg viewBox="0 0 200 200" class="telemetry-dial">
        <circle cx="100" cy="100" r="90" class="dial-ring"/>
        <circle cx="100" cy="100" r="70" class="dial-ring-inner"/>
        <circle id="currentLeftArc" cx="100" cy="100" r="80" class="arc arc-left"/>
        <circle id="currentRightArc" cx="100" cy="100" r="60" class="arc arc-right"/>
        <text x="100" y="90" class="dial-label" text-anchor="middle">VBUS</text>
        <text id="vbusValue" x="100" y="112" class="dial-value" text-anchor="middle">--.- V</text>
        <text id="dutyValue" x="100" y="132" class="dial-sub" text-anchor="middle">L -- / R --</text>
      </svg>
      <!-- Per-side drive current (one INA219 per side; each side's two motors
           are paralleled, so this is the pair's total). Dashed line = the
           1.8 A per-channel ceiling. -->
      <div class="current-bars">
        <div class="current-bar">
          <div class="current-well">
            <div class="current-fill current-fill-left" id="currentLeftFill"></div>
            <div class="current-ceiling"></div>
          </div>
          <span class="current-value" id="currentLeftValue">-.-- A</span>
          <span class="current-label">LEFT</span>
        </div>
        <div class="current-bar">
          <div class="current-well">
            <div class="current-fill current-fill-right" id="currentRightFill"></div>
            <div class="current-ceiling"></div>
          </div>
          <span class="current-value" id="currentRightValue">-.-- A</span>
          <span class="current-label">RIGHT</span>
        </div>
      </div>
    </section>
  </div>

  <!-- Broker login, shown only on the HTTPS (EC2) host - see app.js. -->
  <form class="login" id="loginForm" hidden>
    <div class="login-title">BROKER LOGIN</div>
    <input id="loginUser" autocomplete="username" autocapitalize="off" value="dashboard" aria-label="Username">
    <input id="loginPass" type="password" autocomplete="current-password" placeholder="password" aria-label="Password">
    <button type="submit">CONNECT</button>
    <div class="login-error" id="loginError"></div>
  </form>

  <script src="https://cdn.jsdelivr.net/npm/mqtt@5.10.1/dist/mqtt.min.js"></script>
  <script src="/mix.js"></script>
  <script src="/mqtt_topics.js"></script>
  <script src="/app.js"></script>
</body>
</html>
