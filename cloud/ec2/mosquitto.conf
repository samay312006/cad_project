# EC2 broker config (design doc D4/D5). Counterpart of cloud/mosquitto/mosquitto.conf,
# which is the anonymous LOCAL rehearsal file and must never be used here.
per_listener_settings true

# Raw MQTT over TLS - the ESP32 connects here (PubSubClient / WiFiClientSecure).
listener 8883
protocol mqtt
certfile /etc/mosquitto/certs/server.crt
keyfile /etc/mosquitto/certs/server.key
tls_version tlsv1.2
allow_anonymous false
password_file /etc/mosquitto/passwd
acl_file /etc/mosquitto/acl

# MQTT-over-WebSocket, loopback only. nginx terminates TLS on 443 and proxies
# /mqtt here, so the browser dashboard speaks wss:// and this port is never public.
listener 9001 127.0.0.1
protocol websockets
allow_anonymous false
password_file /etc/mosquitto/passwd
acl_file /etc/mosquitto/acl
