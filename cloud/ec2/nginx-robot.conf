server {
    listen 443 ssl;
    server_name _;
    ssl_certificate     /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    root /var/www/dashboard;
    index index.html;

    # Always revalidate: without this, browsers heuristically cache the JS and
    # keep running a stale mqtt_topics.js against a newer app.js (seen on the
    # phone 2026-10-17: magnet button did nothing). 304s keep it cheap.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ =404;
    }

    location = /mqtt {
        proxy_pass http://127.0.0.1:9001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
    }
}
